name: Build and Release (Frozen)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: Frozen Windows candidate
    runs-on: windows-2025
    outputs:
      release-tag: ${{ steps.release-ref.outputs.tag }}
      prerelease: ${{ steps.release-ref.outputs.prerelease }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate release tag
        id: release-ref
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag must match VERSION exactly: expected $expectedTag, got $env:RELEASE_TAG"
          }

          if (Test-Path -LiteralPath .git/shallow) {
            git fetch --no-tags --unshallow origin '+refs/heads/main:refs/remotes/origin/main'
          } else {
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          }
          $releaseCommit = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor $releaseCommit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $env:RELEASE_TAG does not point to a commit on main"
          }

          $isPrerelease = $version.Contains('-').ToString().ToLowerInvariant()
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '30.2'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action commit
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-msvc

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.49.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Go tools
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.6
          go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.9

      - name: Verify and build
        shell: pwsh
        run: |
          Get-Content -LiteralPath .env.online.example | ForEach-Object {
            $line = $_.Trim()
            if ($line -and -not $line.StartsWith('#')) {
              $key, $value = $line -split '=', 2
              [Environment]::SetEnvironmentVariable($key, $value, 'Process')
            }
          }
          task package

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: artifacts/staging/Yotta
          format: spdx-json
          output-file: artifacts/yotta.spdx.json
          syft-version: v1.44.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: artifacts/staging/Yotta
          format: cyclonedx-json
          output-file: artifacts/yotta.cdx.json
          syft-version: v1.44.0
          upload-artifact: false
          upload-release-assets: false

      - name: Write release checksums
        shell: pwsh
        run: |
          $paths = @(
            (Get-ChildItem artifacts/Yotta-*.zip).FullName,
            (Resolve-Path artifacts/yotta.spdx.json).Path,
            (Resolve-Path artifacts/yotta.cdx.json).Path
          )
          ./scripts/write-release-checksums.ps1 -Path $paths

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --tags origin
          $releaseCommit = (git rev-parse HEAD).Trim()
          $parent = git rev-parse "$releaseCommit`^" 2>$null
          $previousTag = $null
          if ($LASTEXITCODE -eq 0) {
            $previousTag = @(
              git tag --merged $parent --list 'v*' --sort=-version:refname
            ) | Select-Object -First 1
          }
          $range = if ($previousTag) { "$previousTag..$releaseCommit" } else { $releaseCommit }
          $changes = @(git log --first-parent --reverse --format='- %s (%h)' $range)
          if ($changes.Count -eq 0) { $changes = @('- Release metadata only.') }
          $notes = @(
            "Windows x64 portable build for $env:RELEASE_TAG."
            ''
            '> This build is not Authenticode-signed. Verify `SHA256SUMS` and the GitHub attestations before use.'
            ''
            '## Changes'
            ''
          ) + $changes
          Set-Content -LiteralPath artifacts/RELEASE_NOTES.md -Value $notes -Encoding utf8NoBOM

      - name: Attest build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            artifacts/Yotta-*.zip
            artifacts/yotta.spdx.json
            artifacts/yotta.cdx.json
            artifacts/SHA256SUMS

      - name: Attest SPDX SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: artifacts/Yotta-*.zip
          sbom-path: artifacts/yotta.spdx.json

      - name: Upload frozen candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yotta-windows-release-candidate
          path: |
            artifacts/Yotta-*.zip
            artifacts/yotta.spdx.json
            artifacts/yotta.cdx.json
            artifacts/SHA256SUMS
            artifacts/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download frozen candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: yotta-windows-release-candidate
          path: release-assets

      - name: Publish complete asset set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release-tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(release-assets/Yotta-*.zip)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one Yotta release archive, found ${#archives[@]}"
            exit 1
          fi
          assets=(
            "${archives[0]}"
            release-assets/yotta.spdx.json
            release-assets/yotta.cdx.json
            release-assets/SHA256SUMS
          )
          for asset in "${assets[@]}" release-assets/RELEASE_NOTES.md; do
            [[ -f "$asset" ]] || { echo "::error::Missing release file: $asset"; exit 1; }
          done

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to replace published assets"
            exit 1
          fi

          release_flags=(
            --verify-tag
            --title "Yotta ${RELEASE_TAG#v}"
            --notes-file release-assets/RELEASE_NOTES.md
          )
          if [[ "$PRERELEASE" == 'true' ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi

          gh release create "$RELEASE_TAG" "${assets[@]}" "${release_flags[@]}"
          gh release view "$RELEASE_TAG" --json url,tagName,isDraft,isPrerelease
